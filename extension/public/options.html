<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>unfold options</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="options">
  <h1>unfold</h1>
  <form id="form">
    <label>App URL <input id="baseUrl" type="url" required placeholder="https://your-unfold.vercel.app" /></label>
    <label>API token <input id="token" type="password" required placeholder="unf_…" /></label>
    <p class="hint">Create a token in the web app under Settings → Chrome extension.</p>
    <button type="submit">Save</button>
  </form>
  <p id="status" class="status"></p>
  <script src="options.js" type="module"></script>
</body>
</html>
